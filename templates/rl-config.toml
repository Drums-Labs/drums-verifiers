# The one file you edit to train on your own GPUs with Drums desktops. Both templates read it:
#   templates/modal/    your own Modal account      (modal run --detach templates/modal/app.py::launch --what train)
#   templates/gpu-box/  any 8-GPU Linux machine     (templates/gpu-box/run.sh train)
# Every key is explained in docs/train-on-your-gpus.md. The values below are the D1 run's (Qwen3.5-27B, full parameter,
# 8 GPUs, 128 desktops), which trained to the end on 8 x H200.

[model]
repo = "Qwen/Qwen3.5-27B"
# A pinned Hugging Face commit. The download writes refs/main for it, so an offline lookup of the repo name finds it.
revision = "fc05daec18b0a78c049392ed2e771dde82bdf654"

[gpus]
# Modal: tried in this order; the first type with capacity wins (a list is Modal's fallback mechanism).
modal = ["H200:8", "B200:8"]
modal_eval = ["H200:2", "B200:2"]    # evaluation and the step-0 scan: one vLLM server, tensor parallel 2
count = 8                            # GPUs in the training machine
inference = 2                        # the first `inference` GPUs serve vLLM (tensor parallel = this number)
trainer = 6                          # the rest train (FSDP2); inference + trainer = count
# Modal region pin: "" = none (base price), "us" = 1.15x, "us-east" = 1.75x (modal.com/docs/guide/region-selection)
region = ""
cpu = 32
memory_gib = 256
# Cancel a launch when no container has started after this many minutes (D1 waited 3 h for 2 x B200 and got none).
start_deadline_min = 20

[drums]
# Modal: the name of a Modal Secret you create with DRUMS_URL and DRUMS_TOKEN (docs: "create the secret").
# gpu-box: DRUMS_URL and DRUMS_TOKEN are read from the environment of run.sh instead.
modal_secret = "drums"

[tasks]
# A drums_tasks.split output (or any directory with a tasks.jsonl), copied to the runs volume by `prepare`.
# Relative paths are relative to this file.
train = "tasks/train"
heldout = "tasks/heldout"
desktops = 128                       # desktops in flight at most; your workspace quota must allow it

[run]
name = "train"                       # fixed, so a retry or a second launch resumes the same run directory
seed = 20261116
max_steps = 64                       # a ceiling; the budget below usually ends the run first
ckpt_interval = 1                    # a full checkpoint every N steps (27B: about 333 GB and 7 min each on Modal)
recipe = "common/prime-rl-drums.toml"  # the prime-rl TOML template, relative to this file

[budget]
# The train function stops itself (and does not retry) when the GPU spend of everything launched with this config
# (scan, smoke, train, evaluations) reaches `usd`, or the train function's own wall clock reaches `hours`.
# 0 turns a limit off. The ledger is <runs>/spend.jsonl; `spend` prints it.
usd = 500
hours = 8

[prices]
# USD per GPU-hour by GPU name, Modal list prices read 2026-11-16 (`modal billing rates`); check modal.com/pricing.
H200 = 4.54
B200 = 6.25
cpu_core_hour = 0.0473
memory_gib_hour = 0.008
# gpu-box: what the whole machine costs you per hour (0 = only the hours limit applies).
box_usd_per_hour = 0

[image]
# prime-rl is not on PyPI: it is built from this commit (the one D1 ran). Changing it needs the three editable versions
# in templates/common/Dockerfile recomputed (see the guide).
prime_rl_commit = "167d4c3bf1cf9d4444cf1b508f3bc2f231f272dc"
# drums-verifiers for the image. The recipe's screenshot-window keys need 0.3.0 (proposed, not released yet), so the
# image installs a pinned commit of this repository. Replace PIN_A_COMMIT with the full 40-character sha of the commit
# you run (for D2: the merge commit of integrate/post-d1 on main). Once 0.3.0 is on PyPI, "drums-verifiers==0.3.0" works
# too. `main` and the placeholder are refused by `run.sh build`, the Modal app and `check`, so a study never runs on
# whatever main happens to be (set DRUMS_RL_ALLOW_UNPINNED=1 to try an unpinned build on purpose).
drums_verifiers = "drums-verifiers @ git+https://github.com/Drums-Labs/drums-verifiers@PIN_A_COMMIT"
drums_sdk = "drums-sdk==0.3.0"

[modal]
app = "drums-rl"
weights_volume = "drums-rl-weights"
runs_volume = "drums-rl-runs"
