# Release: a `v*` tag builds the sdist and wheel, tests the wheel on every supported Python, then publishes to PyPI from
# the `pypi` environment (its required reviewer approves; its PYPI_API_TOKEN secret is the project token). A manual run
# builds and tests only.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Read the version
        id: meta
        run: |
          v=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "package version: $v"
      - name: Release gates
        run: |
          set -e
          grep -Eq '^license = "Apache-2.0"' pyproject.toml || { echo 'pyproject.toml: license line missing'; exit 1; }
          grep -q 'Apache License' LICENSE || { echo 'LICENSE is not the Apache text'; exit 1; }
          grep -q '@ git+' pyproject.toml && { echo 'pyproject.toml still has a direct git dependency (PyPI refuses those)'; exit 1; }
          grep -q "## ${{ steps.meta.outputs.version }} " CHANGELOG.md || { echo "CHANGELOG.md has no entry for ${{ steps.meta.outputs.version }}"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            [ "${GITHUB_REF_NAME}" = "v${{ steps.meta.outputs.version }}" ] \
              || { echo "tag ${GITHUB_REF_NAME} does not match version v${{ steps.meta.outputs.version }}"; exit 1; }
          fi
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: test the wheel on ${{ matrix.python }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install the wheel into a clean venv and run the tests against it
        run: |
          python -m venv v
          v/bin/pip install --quiet dist/*.whl pytest pytest-asyncio
          v/bin/python -c 'import drums_verifiers, drums_tasks, drums_chat, drums_adapters; print("import ok")'
          v/bin/vf-run --help > /dev/null
          v/bin/python -m pytest -q tests

  publish-pypi:
    name: publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/drums-verifiers/${{ needs.build.outputs.version }}/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          print-hash: true
