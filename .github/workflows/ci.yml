name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]' ruff
      - name: Lint
        run: ruff check .
      - name: Tests (unit, and vf-run end to end against the fake drumsd; nothing needs a Drums host)
        run: python -m pytest tests

  # A-40: pip-audit on what CI installs (pip install -e '.[test]' resolves the same set). Fails on any advisory not in
  # .pip-audit-ignore. The factory pins are audited report-only (see .github/workflows/dependency-audit.yml).
  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: .github/scripts/pip-audit.sh '.[test]'
