# Weekly dependency audit (A-40): the same pip-audit as CI, on a schedule, against today's advisory database and today's
# resolution of the declared ranges. On failure it opens one issue labelled "dependencies", or comments on the one that
# is already open; it never closes an issue (a person does, after the fix lands).
name: dependency-audit

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (gate)
        id: gate
        run: |
          set -o pipefail
          .github/scripts/pip-audit.sh '.[test]' 2>&1 | tee audit.log
      # Report-only: the factory's generator pins must equal drumsd's checker venv (install/osw-requirements.lock), so
      # they are raised together with drumsd, not here. Findings show in the log and the run summary; they do not open
      # the issue.
      - name: pip-audit (factory pins, report-only)
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          .github/scripts/pip-audit.sh -r t6/requirements-factory.txt 2>&1 | tee factory-audit.log \
            || { echo "::warning::factory pins have known vulnerabilities (see factory-audit.log); they move with drumsd's checker venv"; \
                 { echo '### factory pins (report-only)'; grep -E '^Found' factory-audit.log; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-log
          path: "*.log"
          if-no-files-found: ignore

  report:
    name: open or update the issue
    needs: audit
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the "dependencies" issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Weekly dependency audit failed"
          body="The scheduled pip-audit found a vulnerability that is not in .pip-audit-ignore (or an allowlist entry is past its review date). Run: $RUN_URL (the log is the run's audit-log artifact). Fix by raising the pin, or add the advisory to .pip-audit-ignore with a reason and a review date."
          gh label create dependencies --repo "$REPO" --color 0366d6 --description "Pull requests that update a dependency file" 2>/dev/null || true
          n=$(gh issue list --repo "$REPO" --state open --label dependencies --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$REPO" --body "Still failing on $(date -u +%F): $RUN_URL"
            echo "commented on #$n"
          else
            gh issue create --repo "$REPO" --title "$title" --label dependencies --body "$body"
          fi
