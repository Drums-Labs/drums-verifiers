[project]
name = "drums-verifiers"
version = "0.3.0"
description = "Drums computer-use environments (isolated desktops, OSWorld tasks, gate-checked rewards) for verifiers and prime-rl."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Drums Labs"}]
keywords = ["drums", "computer-use", "reinforcement-learning", "rl", "verifiers", "prime-rl", "osworld", "desktop", "environment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # verifiers v1. prime-rl a566e5d8 pins commit 60290d43 (between the 0.4.0 and 0.4.1 releases); 0.4.1 contains it.
    "verifiers>=0.4.1,<0.5",
    "pillow>=10",
    # the Drums SDK (distribution drums-sdk, import name drums, standard library only)
    "drums-sdk>=0.3.0",
]

[project.urls]
Homepage = "https://drums.run"
Documentation = "https://docs.drums.run/guides/prime-rl-and-verifiers"
Repository = "https://github.com/Drums-Labs/drums-verifiers"
Changelog = "https://github.com/Drums-Labs/drums-verifiers/blob/main/CHANGELOG.md"
Issues = "https://github.com/Drums-Labs/drums-verifiers/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
# the task factory's generator: the same versions as drumsd's checker venv (install/osw-requirements.lock), so a build is
# byte-identical anywhere. pillow==11.0.0 conflicts with prime-rl's renderers[multimodal] (pillow>=12.2.0): install this
# extra in its own venv (.venv-factory), never next to prime-rl. See CONTRIBUTING.md.
factory = ["openpyxl==3.1.5", "python-docx==1.2.0", "python-pptx==1.0.2", "pillow==11.0.0", "lxml==6.1.3"]
verl = ["verl==0.9.1", "cachetools", "uvicorn", "fastapi"]
skyrl = ["skyrl-gym==0.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drums_verifiers", "src/drums_chat", "src/drums_tasks", "src/drums_adapters"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
# long lines, compact one-line statements and `l` as a name are this code's style; unused locals are left to review
ignore = ["E501", "E702", "E741", "F841"]

[tool.ruff.lint.per-file-ignores]
# the lab verifier is shipped byte-for-byte to hosts and hashed in index.json: not reformatted by a linter
"src/drums_tasks/verifier/drums_t6.py" = ["F401"]
